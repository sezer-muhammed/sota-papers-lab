[package]
name = "spl-nn"
description = "Transformer building blocks on CUDA: cuBLASLt bf16/FP8 GEMMs, fused LayerNorm + FP8 quantisation, QKV prologue with QK-norm and 2D RoPE, FlashAttention-2-style attention, fused residual."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
# cuBLASLt is loaded at runtime like the driver and NVRTC, so this crate
# still compiles and type-checks without CUDA.
cudarc = { workspace = true, features = ["cublaslt"] }
spl-core.workspace = true
spl-gpu.workspace = true

[lints]
workspace = true
