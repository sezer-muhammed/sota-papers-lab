name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    # No GPU here: everything compiles and non-GPU tests run. GPU tests go to
    # a self-hosted runner labelled `gpu` once one exists.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.99"
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - name: Generated TypeScript bindings are committed
        run: git diff --exit-code -- web/bindings

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm --filter @spl/shell test
      - run: pnpm build
