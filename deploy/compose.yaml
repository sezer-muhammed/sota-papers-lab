# Local Linux machine with an NVIDIA GPU:
#   SPL_GIT_SHA=$(git rev-parse --short HEAD) docker compose -f deploy/compose.yaml up -d --build
name: sota-papers-lab

services:
  spl:
    build:
      context: ..
      dockerfile: deploy/docker/Dockerfile
      args:
        SPL_GIT_SHA: ${SPL_GIT_SHA:-unknown}
    ports:
      - "7070:7070"
    environment:
      SPL_CONFIG: /etc/spl/local.toml
      SPL_AUTH_TOKEN: ${SPL_AUTH_TOKEN:-}
      SPL_DATASETS: /data/datasets
      SPL_MODELS_DIR: /models
      SPL_VGGT_WEIGHTS: /models/vggt-omega/vggt_omega_1b_512.safetensors
    volumes:
      - ../data:/var/lib/spl
      - ${SPL_DATASETS_HOST:-../data/datasets}:/data/datasets:ro
      - ${SPL_MODELS_HOST:-./models}:/models:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped
