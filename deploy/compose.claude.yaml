# Opt-in: ops may call the host user's `claude` CLI (raw_retouch.auto plans
# looks and judges with it) on that user's Claude subscription login. The
# container runs as the host user with the same HOME and sees only what the
# native CLI needs, at the same absolute paths:
#   ~/.claude              read-write: OAuth credentials, refreshed in place
#                          and shared with the host CLI; session transcripts
#   ~/.claude.json         read-only: settings. A single-file bind mount pins
#                          the inode, and the host CLI replaces this file by
#                          rename, so writes from here would be lost or torn.
#                          The CLI runs fine on the pinned snapshot.
#   ~/.local/share/claude  read-only: the CLI's versioned binaries
#   ~/.local/bin           read-only: the `claude` symlink, which follows the
#                          host's updates
#
# Setup (docs/DEPLOY.md): give ../data to the host user once, then in
# deploy/.env:
#   COMPOSE_FILE=compose.yaml:compose.tailnet.yaml:compose.claude.yaml
#   SPL_UID=<id -u>   SPL_GID=<id -g>   (both default to 1000)
# Run `docker compose` as that user, not with sudo: HOME comes from the shell.
# Never set ANTHROPIC_API_KEY here; it would switch the CLI to billed API use.
services:
  spl:
    user: "${SPL_UID:-1000}:${SPL_GID:-1000}"
    environment:
      HOME: ${HOME:?run docker compose as the user whose claude login to use}
      PATH: ${HOME}/.local/bin:/usr/local/cuda/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
      SPL_CLAUDE_BIN: ${HOME}/.local/bin/claude
      # The binaries are mounted read-only; the host CLI keeps them current.
      DISABLE_AUTOUPDATER: "1"
    volumes:
      - ${HOME}/.claude:${HOME}/.claude
      - ${HOME}/.claude.json:${HOME}/.claude.json:ro
      - ${HOME}/.local/share/claude:${HOME}/.local/share/claude:ro
      - ${HOME}/.local/bin:${HOME}/.local/bin:ro
