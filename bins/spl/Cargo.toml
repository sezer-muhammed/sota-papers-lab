[package]
name = "spl-cli"
description = "`spl`: serve the universal API, list ops, run them locally."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "spl"
path = "src/main.rs"

[features]
default = ["all-apps"]
all-apps = ["spl-catalog/default"]

[dependencies]
anyhow.workspace = true
axum.workspace = true
clap.workspace = true
serde_json.workspace = true
spl-catalog.workspace = true
spl-core.workspace = true
spl-host.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true
