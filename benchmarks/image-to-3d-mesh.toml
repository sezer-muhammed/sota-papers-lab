# Mesh extraction quality: Gaussian splats → textured mesh → F1 / Chamfer.
#
# T&T official F1 with Sim(3) alignment; DTU Chamfer on 15 scans.
# DTU datasets are placeholders — manifests to be added.

[suite]
name = "mesh"
description = "Mesh quality from Gaussian splat extraction (F1, Chamfer distance)"
app = "image-to-3d"
op = "image_to_3d.bench"

[protocol]
metrics = ["f1", "precision", "recall", "chamfer_distance", "train_time", "mesh_time", "peak_vram"]
datasets_toml = "benchmarks/image-to-3d/datasets.toml"

[baselines]
results_jsonl = "~/spl-work/bench/results.jsonl"
paper_toml = "apps/image-to-3d/paper.toml"

# Tanks and Temples (available in datasets.toml)

[[scenes]]
name = "truck"
dataset = "tandt"

[[scenes]]
name = "train"
dataset = "tandt"

