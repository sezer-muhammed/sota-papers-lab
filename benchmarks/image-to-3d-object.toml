# Object reconstruction from sparse views (1/2/4/8 images).
#
# All datasets are placeholders — manifests to be added when the object
# benchmark is first run.

[suite]
name = "object"
description = "Object reconstruction quality from sparse unposed views"
app = "image-to-3d"
op = "image_to_3d.bench"

[protocol]
view_counts = [1, 2, 4, 8]
metrics = ["chamfer_distance", "f_score", "normal_psnr", "normal_lpips", "train_time", "peak_vram"]
datasets_toml = "benchmarks/image-to-3d/datasets.toml"

[baselines]
results_jsonl = "~/spl-work/bench/results.jsonl"
paper_toml = "apps/image-to-3d/paper.toml"

