# Image-to-3D benchmark datasets (Phase 0 manifest).
#
# fetch_datasets.py reads this file. It downloads only what the protocol uses,
# verifies it, and writes <root>/<dataset dir>/<scene>/SHA256SUMS.
#
# Hashes
# - archives.*.md5: the object MD5 the server reports (GCS x-goog-hash / ETag).
#   Checked against the HEAD response before anything is fetched.
# - archives.*.sha256: sha256 of the whole archive, checked when it is
#   downloaded in full (fetch = "full").
# - scenes.*.sha256_tree: sha256 of the scene's SHA256SUMS listing (one
#   "<sha256>  <relative path>" line per kept file, sorted by path, LF endings).
#   It covers exactly the kept files, so it is the check that matters for
#   range-fetched archives. Every zip member is also CRC32-checked on extraction.
#
# Protocol (3DGS / gsplat convention, used by every baseline and by our app):
# - `images` is the folder both training and ground truth come from, used as
#   is: Mip-NeRF 360 images_4 outdoor (about 1237x822) and images_2 indoor
#   (about 1557x1038); T&T (979x546, 980x545) and Deep Blending (1264x832,
#   1332x876) as packaged by 3DGS. All are under 1600 px wide, so 3DGS's
#   automatic 1600 px rescale never applies and every tool sees these pixels.
# - Test views: sort image file names, hold out index % test_every == 0.

schema = 1
root = "~/spl-work/datasets"

[archives.mipnerf360_v2]
url = "https://storage.googleapis.com/gresearch/refraw360/360_v2.zip"
bytes = 12535427936
md5 = "cef2ef3aeaf0c062dbe65130bc249870"
fetch = "ranges"  # only the kept members are fetched, with HTTP range requests
dest = "mipnerf360"

[archives.mipnerf360_extra]
url = "https://storage.googleapis.com/gresearch/refraw360/360_extra_scenes.zip"
bytes = 4488140217
md5 = "44f434fc32391c2d0be9bcd15f22bd6a"
fetch = "ranges"
dest = "mipnerf360"

[archives.tandt_db]
url = "https://repo-sam.inria.fr/fungraph/3d-gaussian-splatting/datasets/input/tandt_db.zip"
bytes = 682628995
sha256 = "816e62f22a161abbfe841d2a6b10cdf036e297c9fa289b3bfeee9c6ec526d7e1"
fetch = "full"
dest = ""  # the archive already has tandt/ and db/ at its top level

[datasets.mipnerf360]
title = "Mip-NeRF 360"
citation = "Barron et al., Mip-NeRF 360: Unbounded Anti-Aliased Neural Radiance Fields, CVPR 2022"
homepage = "https://jonbarron.info/mipnerf360/"
licence = "No licence stated by the authors; treated as research use only. Do not redistribute."

[datasets.tandt]
title = "Tanks and Temples (3DGS COLMAP package)"
citation = "Knapitsch et al., Tanks and Temples, SIGGRAPH 2017; COLMAP reconstructions from Kerbl et al., 3D Gaussian Splatting, SIGGRAPH 2023"
homepage = "https://www.tanksandtemples.org/"
licence = "CC BY 4.0, with a licence grant limited to non-commercial scientific research (tanksandtemples.org/license)"

[datasets.db]
title = "Deep Blending (3DGS COLMAP package)"
citation = "Hedman et al., Deep Blending for Free-Viewpoint Image-Based Rendering, SIGGRAPH Asia 2018; package from Kerbl et al. 2023"
homepage = "http://visual.cs.ucl.ac.uk/pubs/deepblending/"
licence = "Research use only (no explicit licence in the 3DGS package). Do not redistribute."

# Mip-NeRF 360: outdoor scenes use images_4, indoor scenes images_2.

[scenes.bicycle]
dataset = "mipnerf360"
archive = "mipnerf360_v2"
src = "bicycle/"
keep = ["images_4/", "sparse/0/", "poses_bounds.npy"]
images = "images_4"
outdoor = true
