# Pose and depth estimation: VGGT-Ω accuracy vs DUSt3R / MASt3R.
#
# Datasets not yet in datasets.toml — manifests to be added when the pose
# benchmark is first run. Metrics follow the VGGT evaluation protocol.

[suite]
name = "pose"
description = "Camera pose and depth accuracy of the VGGT-Ω engine"
app = "image-to-3d"
op = "image_to_3d.bench"

[protocol]
metrics = ["auc_3", "auc_30", "depth_absrel", "delta_1_25", "stage_ms", "peak_vram"]
datasets_toml = "benchmarks/image-to-3d/datasets.toml"

[baselines]
results_jsonl = "~/spl-work/bench/results.jsonl"
paper_toml = "apps/image-to-3d/paper.toml"

